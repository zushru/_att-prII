[platformio]
default_envs = att
src_dir = src
lib_dir = lib
test_dir = test

[env:native]
platform = native
build_src_filter = -<*>
test_framework = unity
build_flags =
  -DATT_NATIVE_TEST=1
  -Wall
  -Wextra
  -Itest/test_as608_gate/stubs
  -Itest/test_nvs_config/stubs
  -Itest/test_esp32_secure_random/stubs
  -Itest/test_esp32_clock_monotonic/stubs
  -Itest/test_esp32_mbedtls_pin_verifier/stubs
  -Itest/test_esp32_wifi_ap/stubs
  -Itest/test_esp32_oled/stubs
  -Itest/test_esp32_recovery_presence/stubs
  -Itest/test_ds3231/stubs
  -Ilib/as608/src
  -Ilib/hal_esp32/src
  -Ilib/core/src
  -Ilib/littlefs_file_set/src

[env:att]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
; Signed 4 MiB layout: 2.5 MiB factory app / 1.4375 MiB LittleFS.
; Platform 8.0.0 ships Xtensa GCC 14.2, which supports size-aggressive -Oz.
build_unflags =
  -Os
# The dashboard is checked in as a pre-generated gzip header. Only the
# hash-pinned WebServer compatibility patch is required at build time.
extra_scripts =
  pre:scripts/build/apply_pinned_webserver_patch.py
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions/att.csv
lib_deps =
  adafruit/Adafruit SSD1306@2.5.17
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
lib_ldf_mode = chain+
upload_speed = 115200
build_flags =
  -Oz
  -std=gnu++11
  -Wall
  -Wextra
  -Wl,--wrap=nvs_flash_init
  -Wl,--wrap=nvs_flash_erase
  -Wl,--wrap=nvs_flash_erase_partition
  -Wl,--wrap=nvs_flash_erase_partition_ptr
  -Wl,-u,__wrap_nvs_flash_erase
  -Wl,-u,__wrap_nvs_flash_erase_partition
  -Wl,-u,__wrap_nvs_flash_erase_partition_ptr
  -Wl,--wrap=esp_partition_erase_range
